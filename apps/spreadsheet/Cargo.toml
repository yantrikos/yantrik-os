[package]
name = "yantrik-spreadsheet"
version = "0.1.0"
edition = "2021"
description = "ySheets — one sheet of formulas, opened from and saved to CSV, with undo and a control surface"

[[bin]]
name = "yantrik-spreadsheet"
path = "src/main.rs"

[dependencies]
yantrik-app-runtime = { path = "../../crates/yantrik-app-runtime" }
yantrik-ipc-contracts = { workspace = true }
yantrik-ipc-transport = { workspace = true }
yantrik-design-tokens = { workspace = true }
yantrik-ui-kit = { workspace = true }
slint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# O_NONBLOCK, so opening a FIFO cannot hang the window (src/document.rs).
libc = { workspace = true }
# The desktop's file picker, over the FileChooser portal (src/picker.rs).
zbus = { workspace = true }

[dev-dependencies]
png = "0.18"

[build-dependencies]
yantrik-app-build = { workspace = true }
