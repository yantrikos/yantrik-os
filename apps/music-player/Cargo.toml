[package]
name = "yantrik-music-player"
version = "0.1.0"
edition = "2021"
description = "Yantrik Music Player — a scanned library, a queue, and playback through mpv"

[[bin]]
name = "yantrik-music-player"
path = "src/main.rs"

[dependencies]
yantrik-app-runtime = { path = "../../crates/yantrik-app-runtime" }
yantrik-ipc-contracts = { workspace = true }
yantrik-ipc-transport = { workspace = true }
yantrik-design-tokens = { workspace = true }
yantrik-ui-kit = { workspace = true }
slint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }

[build-dependencies]
yantrik-app-build = { workspace = true }

[dev-dependencies]
# The answer-later slot a real dispatch opens, so the tests run actions the way the socket does.
yantrik-surface = { workspace = true }
