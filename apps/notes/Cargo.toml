[package]
name = "yantrik-notes"
version = "0.1.0"
edition = "2021"
description = "Yantrik Notes - native Markdown workspace, on YantrikApp"

# The app is a library the framework runs (`src/lib.rs`: the `App`), and a three-line binary.
# Its behaviour is tested headless through yantrik-testing, its store through the framework's
# fault-injecting disk.
[lib]
path = "src/lib.rs"

[[bin]]
name = "yantrik-notes"
path = "src/main.rs"

[dependencies]
yantrik-app = { workspace = true }
# The rule for which files an agent may name (`home_paths`), for `import` and `export`.
yantrik-ipc-contracts = { workspace = true }
yantrik-design-tokens = { workspace = true }
yantrik-ui-kit = { workspace = true }
slint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid7 = { workspace = true }
chrono = { workspace = true }

libc = "0.2"
pulldown-cmark = { version = "0.13.1", default-features = false }

[dev-dependencies]
yantrik-testing = { workspace = true }
# FaultyDisk, to make any step of any write fail.
yantrik-app = { workspace = true, features = ["testing"] }
png = "0.18"

[build-dependencies]
yantrik-app-build = { workspace = true }
