[package]
name = "yantrik-notes"
version = "0.1.0"
edition = "2021"
description = "Yantrik Notes - native Markdown workspace"

[[bin]]
name = "yantrik-notes"
path = "src/main.rs"

[dependencies]
yantrik-app-runtime = { path = "../../crates/yantrik-app-runtime" }
yantrik-ipc-contracts = { workspace = true }
yantrik-ipc-transport = { workspace = true }
yantrik-design-tokens = { workspace = true }
yantrik-ui-kit = { workspace = true }
slint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid7 = { workspace = true }
chrono = { workspace = true }

libc = "0.2"
pulldown-cmark = { version = "0.13.1", default-features = false }

[dev-dependencies]
png = "0.18"

[build-dependencies]
yantrik-app-build = { workspace = true }
