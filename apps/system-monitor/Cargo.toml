[package]
name = "yantrik-system-monitor"
version = "0.1.0"
edition = "2021"
description = "Yantrik System Monitor — real-time CPU, memory, disk, network, and process monitoring"

[[bin]]
name = "yantrik-system-monitor"
path = "src/main.rs"

[dependencies]
yantrik-app-runtime = { path = "../../crates/yantrik-app-runtime" }
yantrik-ipc-contracts = { workspace = true }
yantrik-ipc-transport = { workspace = true }
yantrik-design-tokens = { workspace = true }
yantrik-ui-kit = { workspace = true }
slint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sysinfo = { workspace = true }
# The local kill path signals through libc directly: errno is the only place the reason lives,
# and sysinfo's own kill answers with a bool that cannot tell ESRCH from EPERM.
libc = "0.2"

[build-dependencies]
yantrik-app-build = { workspace = true }
