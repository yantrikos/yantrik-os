[package]
name = "yantrik-text-editor"
version = "0.1.0"
edition = "2021"
description = "Yantrik Text Editor — multi-tab code/text editor with AI assist"

[[bin]]
name = "yantrik-text-editor"
path = "src/main.rs"

[dependencies]
yantrik-app-runtime = { path = "../../crates/yantrik-app-runtime" }
yantrik-ipc-contracts = { workspace = true }
yantrik-ipc-transport = { workspace = true }
yantrik-design-tokens = { workspace = true }
yantrik-ui-kit = { workspace = true }
slint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The folder watch and the move decisions, shared with yDoc so a file moved in Files does not
# strand the tab holding it open (#86). Carries the notify dependency with it.
yantrik-file-follow = { workspace = true }
libc = "0.2"
regex = "1"

[build-dependencies]
slint-build = "1.17"

[dev-dependencies]
png = "0.18"
