[package]
name = "yantrik-text-editor"
version = "0.1.0"
edition = "2021"
description = "Yantrik Text Editor — multi-tab code/text editor, on YantrikApp"

# The app is a library the framework runs (`src/lib.rs`: the `App`), and a three-line binary.
# Its behaviour is tested headless through yantrik-testing, its saves through the framework's
# fault-injecting disk.
[lib]
path = "src/lib.rs"

[[bin]]
name = "yantrik-text-editor"
path = "src/main.rs"

[dependencies]
yantrik-app = { workspace = true }
yantrik-ipc-contracts = { workspace = true }
yantrik-ipc-transport = { workspace = true }
yantrik-design-tokens = { workspace = true }
yantrik-ui-kit = { workspace = true }
slint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
libc = "0.2"
regex = "1"

[dev-dependencies]
# TestApp, with the window manager's word on activation.
yantrik-testing = { workspace = true, features = ["testing"] }
# FaultyDisk, to make any step of a save fail.
yantrik-app = { workspace = true, features = ["testing"] }
png = "0.18"

[build-dependencies]
yantrik-app-build = { workspace = true }
