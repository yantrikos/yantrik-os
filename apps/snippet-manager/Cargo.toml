[package]
name = "yantrik-snippet-manager"
version = "0.1.0"
edition = "2021"
description = "Yantrik Snippet Manager — code snippet management with collections and tags, on YantrikApp"

# The app is a library the framework runs (`src/lib.rs`: the `App`), and a three-line binary.
# Its behaviour is tested headless through yantrik-testing, with a clipboard and a disk of the
# test's own and a fake Mind.
[lib]
path = "src/lib.rs"

[[bin]]
name = "yantrik-snippet-manager"
path = "src/main.rs"

[dependencies]
yantrik-app = { workspace = true }
yantrik-foundation = { workspace = true }
# The one rule for which files an agent may have an app read (`home_paths`, #443).
yantrik-ipc-contracts = { workspace = true }
yantrik-design-tokens = { workspace = true }
yantrik-ui-kit = { workspace = true }
slint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `activate`: the window manager giving the window the keyboard, as the runner hears it.
yantrik-testing = { workspace = true, features = ["testing"] }
# The log lines every test writes, captured, so a sentinel can prove no snippet's code is in them.
tracing-subscriber = { workspace = true }

[build-dependencies]
yantrik-app-build = { workspace = true }
