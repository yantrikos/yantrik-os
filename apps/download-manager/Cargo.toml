[package]
name = "yantrik-download-manager"
version = "0.1.0"
edition = "2021"
description = "Yantrik Download Manager — download management with checksum verification"

[[bin]]
name = "yantrik-download-manager"
path = "src/main.rs"

[dependencies]
yantrik-app-runtime = { path = "../../crates/yantrik-app-runtime" }
yantrik-ipc-contracts = { workspace = true }
yantrik-ipc-transport = { workspace = true }
yantrik-design-tokens = { workspace = true }
yantrik-ui-kit = { workspace = true }
slint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The transfer itself: ureq blocks, which is what a worker thread wants, and its rustls build
# needs no system OpenSSL on the image.
ureq = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }

[build-dependencies]
slint-build = "1.17"
