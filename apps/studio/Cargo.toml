[package]
name = "yantrik-studio"
version = "0.1.0"
edition = "2021"
description = "Yantrik Studio - image generation on your own GPU or a hosted service, on YantrikApp, with a control surface"

# The app is a library the framework runs (`src/lib.rs`: the `App`), and a three-line binary.
# Its behaviour is tested headless through yantrik-testing, against fake backends in this process.
[lib]
path = "src/lib.rs"

[[bin]]
name = "yantrik-studio"
path = "src/main.rs"

[dependencies]
yantrik-app = { workspace = true }
yantrik-ipc-contracts = { workspace = true }
yantrik-design-tokens = { workspace = true }
yantrik-ui-kit = { workspace = true }
# `is_image` decides what `open`, `upscale` and `delete` will accept. It is the same answer the
# file browser and the image viewer give, because a viewer that disagrees with the browser about
# what it can open is worse than one that opens nothing.
yantrik-image-core = { workspace = true }
# Where an address leads, for the one URL a hosted service may offer a picture at: the same answer the
# download manager gives an agent's fetch.
yantrik-address-place = { path = "../../crates/yantrik-address-place" }
slint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
ureq = { workspace = true }
# One syscall, `renameat2` with RENAME_NOREPLACE, for the move to Trash. It is the same call the
# shell's file operations make, and matching it exactly is what makes a picture deleted here
# restorable from Files rather than merely gone.
libc = { workspace = true }
# A hosted service may answer with the picture inline as base64 rather than as a URL, and both
# shapes have to work: which one arrives depends on the model, and neither is a reason to fail.
base64 = { workspace = true }
# Only to answer "is this a loopback or private address", which is what the grade of `generate`
# turns on. Parsed rather than matched on substrings: a URL a person typed into a config file is
# exactly the input that should not be guessed at.
url = { workspace = true }
# The fake backend draws its PNG here, the gallery's thumbnails are resized here, and `upscale`
# is a resample. Only the two decoders this app can be handed are compiled in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
# `activate`, `display_gone` and `lingering`: the window manager and the compositor, as the runner
# hears them.
yantrik-mind = { workspace = true }
yantrik-testing = { workspace = true, features = ["testing"] }
# Capturing what the app logs, to prove a secret is not in it.
tracing-subscriber = { workspace = true }
# The headless test writes what it drew, so a person can look at it instead of trusting the
# assertions about it.
png = "0.18"

[build-dependencies]
yantrik-app-build = { workspace = true }
