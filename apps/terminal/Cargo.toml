[package]
name = "yantrik-terminal"
version = "0.1.0"
edition = "2021"
description = "Yantrik Terminal — AI-native terminal emulator with PTY support"

[[bin]]
name = "yantrik-terminal"
path = "src/main.rs"

[dependencies]
yantrik-app-runtime = { path = "../../crates/yantrik-app-runtime" }
yantrik-ipc-contracts = { workspace = true }
yantrik-ipc-transport = { workspace = true }
yantrik-design-tokens = { workspace = true }
yantrik-ui-kit = { workspace = true }
slint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
pty-process = "0.5"
vt100 = "0.16"
libc = "0.2"
anyhow = "1"

[lib]
path = "src/session.rs"

[build-dependencies]
yantrik-app-build = { workspace = true }

[dev-dependencies]
png = "0.18"
