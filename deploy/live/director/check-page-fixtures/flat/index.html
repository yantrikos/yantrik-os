<!doctype html>
<html><head><meta charset="utf-8"><title>Flat</title>
<style>html, body { margin: 0; height: 100%; background: #224; }</style>
</head><body><canvas id="c" width="1280" height="800"></canvas>
<script>
// Clears to the background colour and never draws anything on it.
const ctx = document.getElementById("c").getContext("2d");
ctx.fillStyle = "#224";
ctx.fillRect(0, 0, 1280, 800);
</script></body></html>
