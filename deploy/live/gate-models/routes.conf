# live-gate: the cloud providers' routes, inside the model proxy's server block (gate-setup.sh's
# live-model.conf includes this directory). Installed by setup-models.sh, which fills in the
# instance key; root's file, mode 600, because that key is in it.
#
# The same rule as the AIG route: the instance's own key or nothing, exactly one chat path each,
# rate-capped. What is added is the provider's key, here on the gate, from a file only root
# reads, so the instance holds nothing a provider would accept. Whatever its Mind is talked into
# showing on its public screen, there is no key of Pranab's on that machine to show.
#
# The request is not forwarded as sent. live_models.js reads it, refuses a model not on its
# list, caps the answer's length, counts the day's requests, and sends the provider a new body
# built from known fields only. Neither the instance's headers nor the provider's travel across:
# the instance cannot set a provider option, and it never sees the account's usage headers.

# Server-wide, so the AIG route has it too: an upstream may not send a request back into this
# server (X-Accel-Redirect to an internal location would skip the filter and its counts).
proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;

location = /ollama-cloud/v1/chat/completions {
    if ($http_authorization != "Bearer @INSTANCE_KEY@") { return 401; }
    limit_req zone=live_ollama_cloud burst=10 nodelay;
    limit_except POST { deny all; }
    client_max_body_size 384k;
    client_body_buffer_size 384k;
    set $live_provider ollama-cloud;
    js_content live.chat;
}

location = /nanogpt/api/v1/chat/completions {
    if ($http_authorization != "Bearer @INSTANCE_KEY@") { return 401; }
    limit_req zone=live_nanogpt burst=5 nodelay;
    limit_except POST { deny all; }
    client_max_body_size 384k;
    client_body_buffer_size 384k;
    set $live_provider nanogpt;
    js_content live.chat;
}

location = /nim/v1/chat/completions {
    if ($http_authorization != "Bearer @INSTANCE_KEY@") { return 401; }
    limit_req zone=live_nim burst=5 nodelay;
    limit_except POST { deny all; }
    client_max_body_size 384k;
    client_body_buffer_size 384k;
    set $live_provider nim;
    js_content live.chat;
}

# Reached only by live_models.js's subrequest, with the body it built. nginx does not verify an
# upstream's certificate by default, and these requests carry a key worth stealing.
location = /_live_upstream/ollama-cloud {
    internal;
    proxy_pass_request_headers off;
    proxy_set_header Content-Type application/json;
    proxy_set_header Accept "application/json, text/event-stream";
    include /etc/live-gate/ollama-cloud.auth;
    proxy_set_header Host ollama.com;
    proxy_ssl_server_name on;
    proxy_ssl_name ollama.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_http_version 1.1;
    subrequest_output_buffer_size 4m;
    proxy_pass https://ollama.com/v1/chat/completions;
}

location = /_live_upstream/nanogpt {
    internal;
    proxy_pass_request_headers off;
    proxy_set_header Content-Type application/json;
    proxy_set_header Accept "application/json, text/event-stream";
    include /etc/live-gate/nanogpt.auth;
    proxy_set_header Host nano-gpt.com;
    proxy_ssl_server_name on;
    proxy_ssl_name nano-gpt.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_http_version 1.1;
    subrequest_output_buffer_size 4m;
    proxy_pass https://nano-gpt.com/api/v1/chat/completions;
}

location = /_live_upstream/nim {
    internal;
    proxy_pass_request_headers off;
    proxy_set_header Content-Type application/json;
    proxy_set_header Accept "application/json, text/event-stream";
    include /etc/live-gate/nim.auth;
    proxy_set_header Host integrate.api.nvidia.com;
    proxy_ssl_server_name on;
    proxy_ssl_name integrate.api.nvidia.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_http_version 1.1;
    subrequest_output_buffer_size 4m;
    proxy_pass https://integrate.api.nvidia.com/v1/chat/completions;
}
