# Yantrik Live on yantrikos.com. Included in the site's TLS server block by setup-relay.sh.
# ^~ keeps the site's regex rules (its 30-day asset cache) off these paths.

# "/live" as people type it, without the slash.
location = /live {
    return 301 /live/;
}

# The page: its own directory, so a deploy of the website never removes it.
location ^~ /live/ {
    alias /var/www/yantrikos-live/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.6.15/hls.light.min.js; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src 'self'; img-src 'self' data:; worker-src blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}

# The video: MediaMTX's HLS, read-only, from loopback. Only playlists and segments: MediaMTX's own
# player page and anything else it might serve stay unreachable.
location ^~ /live/hls/ {
    location ~ ^/live/hls/[A-Za-z0-9_]+\.(m3u8|ts)$ {
        proxy_pass http://127.0.0.1:8888;
        # MediaMTX's path is /live/…; the public one is /live/hls/…
        rewrite ^/live/hls/(.*)$ /live/$1 break;
        # It sends a new viewer to /live/index.m3u8?cookieCheck=1 first: point that back here.
        proxy_redirect /live/ /live/hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    return 404;
}
