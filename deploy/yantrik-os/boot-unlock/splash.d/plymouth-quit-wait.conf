# plymouth-quit-wait.service.d/yantrik-splash.conf — the gettys are ordered after this unit, and
# stock it waits, unbounded, for plymouthd to exit. tty1's getty is ordered after
# yantrik-splash-release.service instead, which makes plymouthd let go of tty1 within a bound
# (plymouthd itself stays until labwc draws), and no other console draws under plymouth: the
# serial console's login prompt (the CI boot test's `login:`) never waits on it.
[Service]
ExecStart=
ExecStart=/bin/true
