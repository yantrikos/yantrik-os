# plymouth-quit.service.d/yantrik-splash.conf — stock, `plymouth quit` here clears the screen to
# black at multi-user.target, before labwc can draw. Here plymouth deactivates as
# yantrik-splash-release.service does (usually a no-op by then), and the handoff quits it once
# labwc holds the display, or after its fallbacks, for anything that boots without tty1's getty.
[Unit]
Wants=yantrik-splash-handoff.service
After=yantrik-splash-release.service

[Service]
ExecStart=
ExecStart=-/usr/lib/yantrik/boot-unlock/splash release
TimeoutStartSec=20
