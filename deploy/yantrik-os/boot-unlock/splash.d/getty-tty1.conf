# getty@tty1.service.d/yantrik-splash.conf — tty1's autologin starts once plymouth has let go of
# tty1 (yantrik-splash-release.service), with plymouth's last frame, the emblem, still on the
# screen, and leaves that frame there until labwc draws over it (yantrik-splash-handoff.service).
#
# Ordering only, never an Exec* line: systemd takes tty1 for every Exec* line of this unit before
# running it, and waits while plymouthd holds the VT, so a hand-off run from here waited for
# itself, about two minutes on real boots (#820). The selftest holds this file to no Exec* line.
# Wants, not Requires: if the release fails, the autologin still starts.
#
# TTYReset=no and TTYVTDisallocate=no: stock, systemd switches tty1 to text mode and clears it as
# this unit starts. The kernel console then takes the display back from plymouth's frame, and tty1
# stayed black, with its cursor, until labwc drew (3-5 s on OVMF, #820). tty1 is left in graphics
# mode instead. When labwc ends, logind puts tty1 back in text mode; when it never starts, the
# handoff does, and so does the crash guard (`splash console`). agetty still clears the screen
# and resets the line itself.
#
# StandardInput=tty-force: the getty takes tty1 even if a session still has it, rather than wait
# for it to be closed, which is the wait #820 hit. plymouthd has closed tty1 by then (release).
[Unit]
Wants=yantrik-splash-release.service yantrik-splash-handoff.service
After=yantrik-splash-release.service

[Service]
TTYReset=no
TTYVTDisallocate=no
StandardInput=tty-force
