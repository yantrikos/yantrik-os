# /etc/tmpfiles.d/yantrik-splash-cursor.conf — the text cursor back for every console opened
# after boot.
#
# The splash's kernel line says vt.global_cursor_default=0, so the kernel console shows no
# blinking cursor between GRUB and plymouth's first frame (#820, the OVMF film). That is the
# default a console gets when it is first opened, so without this tty2's login, and any other
# console, would have no cursor either. systemd-tmpfiles-setup writes it early in boot, before any
# getty. tty1, opened before this, gets its cursor back when the crash guard writes there
# (boot-unlock/splash console). Writing 1 on a boot that never hid it changes nothing.
w /sys/module/vt/parameters/global_cursor_default - - - - 1
