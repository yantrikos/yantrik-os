# Installed as /etc/systemd/system/mbpfan.service.d/yantrik-apple.conf.
#
# Only on a Mac: anywhere else there is no SMC, mbpfan fails at every boot, and a desktop that
# boots with a failed unit looks broken. The vendor is matched as a glob so there is no space to
# quote ("Apple Inc." is what every Intel Mac reports).
[Unit]
ConditionFirmware=smbios-field(sys_vendor $= Apple*)

[Service]
# mbpfan reads temperatures from coretemp and drives the fans through applesmc. Both normally
# load by themselves on a Mac; asked for here so a missing autoload is not a silent fan.
ExecStartPre=-/usr/sbin/modprobe applesmc
ExecStartPre=-/usr/sbin/modprobe coretemp
# The fan limits for this model, written before mbpfan reads its config.
ExecStartPre=/usr/lib/yantrik/yantrik-mac-fans configure
