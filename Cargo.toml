[workspace]
resolver = "2"
members = [
    "crates/yantrik-companion-core",
    "crates/yantrik-companion-instincts",
    "crates/yantrik-companion-cortex",
    "crates/yantrik-companion-tools",
    "crates/yantrik-chat",
    "crates/yantrik-companion",
    "crates/yantrik-design-tokens",
    "crates/yantrik-ipc-contracts",
    "crates/yantrik-manifest",
    "crates/yantrik-shell-core",
    "crates/yantrik-ui-kit",
    "crates/yantrik-ui-slint",
    "crates/yantrik-ipc-transport",
    "crates/yantrik-service-sdk",
    "crates/yantrikdb-server",
    "crates/yantrik",
    "crates/yantrik-ui",
    "crates/yantrik-ml",
    "crates/yantrik-os",
    "crates/yantrik-brain",
    "services/weather-service",
    "services/system-monitor-service",
    "services/notes-service",
    "services/notifications-service",
    "services/calendar-service",
    "services/network-service",
    "services/email-service",
    "services/perception-service",
    "crates/yantrik-app-runtime",
    "apps/notes",
    "apps/container-manager",
    "apps/download-manager",
    "apps/snippet-manager",
    "apps/system-monitor",
    "apps/terminal",
    "apps/music-player",
    "apps/text-editor",
    "apps/image-viewer",
    "apps/spreadsheet",
    "apps/document-editor",
    "apps/presentation",
    "apps/network-manager",
    "apps/email",
    "apps/calendar",
    "apps/weather",
]

# ── Shared dependencies ──────────────────────────────────────────────
# All crates reference these via { workspace = true } to prevent version drift.
[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Database
rusqlite = { version = "0.37", features = ["bundled"] }  # matches upstream yantrikdb 0.10.1 (one crate may link sqlite3)

# Async / networking
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = "0.8"
ureq = { version = "2", features = ["json"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time / IDs
chrono = { version = "0.4", features = ["serde"] }
uuid7 = "1"

# Text / parsing
regex = "1"
html2text = "0.12"
mailparse = "0.15"
base64 = "0.22"

# Email
imap = "2.4"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["rustls-tls", "builder", "smtp-transport"] }

# Audio
cpal = "0.15"
rubato = "0.16"

# WebSocket
tungstenite = "0.24"
url = "2"

# Concurrency
crossbeam-channel = "0.5"

# UI
# Both renderers are compiled in; SLINT_BACKEND picks at runtime.
# femtovg draws on the GPU (WSLg reaches the real adapter via GALLIUM_DRIVER=d3d12);
# software is the fallback for hosts with no usable GL.
slint = { version = "1.17", features = ["renderer-femtovg", "renderer-software"] }

# System
sysinfo = "0.33"
libc = "0.2"

# Internal crates
yantrik-companion-core = { path = "crates/yantrik-companion-core" }
yantrik-companion-instincts = { path = "crates/yantrik-companion-instincts" }
yantrik-companion-cortex = { path = "crates/yantrik-companion-cortex" }
yantrik-companion-tools = { path = "crates/yantrik-companion-tools" }
yantrik-design-tokens = { path = "crates/yantrik-design-tokens" }
yantrik-ipc-contracts = { path = "crates/yantrik-ipc-contracts" }
yantrik-shell-core = { path = "crates/yantrik-shell-core" }
yantrik-ui-kit = { path = "crates/yantrik-ui-kit" }
yantrik-ipc-transport = { path = "crates/yantrik-ipc-transport" }
yantrik-service-sdk = { path = "crates/yantrik-service-sdk" }
yantrik-app-runtime = { path = "crates/yantrik-app-runtime" }
yantrik-manifest = { path = "crates/yantrik-manifest" }
yantrik-chat = { path = "crates/yantrik-chat" }
yantrik-companion = { path = "crates/yantrik-companion" }
yantrik-os = { path = "crates/yantrik-os" }
yantrik-brain = { path = "crates/yantrik-brain" }
# Upstream yantrikdb, not a vendored fork. The crate is published as `yantrikdb`
# (it was `yantrikdb-core` at 0.1.0), so the `package =` rename keeps every
# existing `use yantrikdb_core::…` call site compiling unchanged — the same
# approach yantrik-mind has been running on in production.
yantrikdb-core = { path = "../yantrikdb/crates/yantrikdb-core", package = "yantrikdb" }
yantrik-ml = { git = "https://github.com/yantrikos/yantrik-ml.git" }
yantrikdb-server = { path = "crates/yantrikdb-server" }

# The workspace previously had no release profile at all, so release builds ran
# with lto = false. Thin LTO is most of the win for a few percent of build time;
# codegen-units is deliberately left at the default 16 rather than 1, because this
# tree is rebuilt and redeployed constantly and serialising codegen would cost more
# developer time than the extra few percent of runtime is worth.
[profile.release]
lto = "thin"

# yantrik-ui-slint is one enormous generated module: 55k lines of .slint become a single
# Rust crate that rustc chews through at ~14 GB RSS, and it is rebuilt on EVERY .slint edit.
# Its code is glue — property bindings and layout — while the hot paths (rasterising, text,
# layout solving) live in Slint's own runtime crates, which keep opt-level 3. Dropping the
# generated crate to opt-level 1 costs nothing measurable at runtime and takes minutes off
# every build; more codegen units let it spread across cores instead of one saturated one.
[profile.release.package.yantrik-ui-slint]
opt-level = 1
codegen-units = 32

# Iteration profile: `cargo build --profile fast`. Workspace crates unoptimised and
# incremental (they are what changes); every dependency at opt-level 3 (they are what runs).
# The software rasteriser lives in the deps, so a fast build still draws at release speed.
[profile.fast]
inherits = "dev"
opt-level = 0
debug = false
incremental = true
[profile.fast.package."*"]
opt-level = 3

# Only optimize LLM-critical deps in dev builds (candle, tokenizers).
# Everything else compiles at opt-level 0 for faster debug builds.
[profile.dev.package.candle-core]
opt-level = 2
[profile.dev.package.candle-nn]
opt-level = 2
[profile.dev.package.candle-transformers]
opt-level = 2
[profile.dev.package.tokenizers]
opt-level = 2

# Local override: adds "thinking": false to API requests for Qwen3.5/DeepSeek
[patch."https://github.com/yantrikos/yantrik-ml.git"]
yantrik-ml = { path = "crates/yantrik-ml" }
