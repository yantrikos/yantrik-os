[workspace]
resolver = "2"
members = [
    "crates/yantrik-companion-core",
    "crates/yantrik-companion-instincts",
    "crates/yantrik-companion-cortex",
    "crates/yantrik-companion-tools",
    "crates/yantrik-chat",
    "crates/yantrik-companion",
    "crates/yantrik-design-tokens",
    "crates/yantrik-ipc-contracts",
    "crates/yantrik-image-core",
    "crates/yantrik-email-text",
    "crates/yantrik-manifest",
    "crates/yantrik-version",
    "crates/yantrik-shell-core",
    "crates/yantrik-ui-kit",
    "crates/yantrik-ui-slint",
    "crates/yantrik-ipc-transport",
    "crates/yantrik-service-sdk",
    "crates/yantrik-surface",
    "crates/yantrikdb-server",
    "crates/yantrik",
    "crates/yantrik-ui",
    "crates/yantrik-ml",
    "crates/yantrik-os",
    "crates/yantrik-brain",
    "services/weather-service",
    "services/system-monitor-service",
    "services/notes-service",
    "services/notifications-service",
    "services/calendar-service",
    "services/network-service",
    "services/email-service",
    "services/perception-service",
    "services/perception-journal",
    "services/a11y-service",
    "crates/yantrik-app-runtime",
    # The folder watch and the move decisions shared by yDoc and the Text Editor, so a file
    # moved in Files does not strand the editor holding it open (#75, #86).
    "crates/yantrik-file-follow",
    "apps/notes",
    "apps/arcade",
    "apps/container-manager",
    "apps/download-manager",
    "apps/snippet-manager",
    "apps/system-monitor",
    "apps/terminal",
    "apps/music-player",
    "apps/text-editor",
    "apps/image-viewer",
    "apps/spreadsheet",
    "apps/document-editor",
    "apps/presentation",
    "apps/network-manager",
    "apps/email",
    "apps/calendar",
    "apps/weather",
    "apps/studio",
    "crates/yantrik-harness",
    "crates/yantrik-agent-terminal",
    # The surface SDK's example, template and guide samples (docs/sdk): built and tested with
    # everything else, so what an outside author copies is what CI ran.
    "examples/hello-surface",
    "examples/hello-window",
    "templates/rust-surface",
    "docs/sdk/samples",
    # The per-app core test crates. Each carried a `[workspace]` table of its own, which made
    # it a workspace root invisible to `cargo test --workspace` — the only cargo test step CI
    # has — so their tests ran only when somebody remembered to cd there. tests/document-core
    # alone held 66 of them, never once run by CI, sixteen added after #84 showed the gap (#85).
    # Members now, so `cargo test --workspace` is enough to run everything; the guard test
    # `a_test_crate_runs_when_ci_runs` in crates/yantrik-ui-kit keeps new ones from drifting.
    "tests/calendar-core",
    "tests/container-core",
    "tests/document-core",
    "tests/email-core",
    "tests/files-core",
    "tests/image-core",
    "tests/network-core",
    "tests/performance-core",
    "tests/presentation-core",
    "tests/settings-core",
    "tests/snippets-core",
    "tests/sysmon-core",
    "tests/weather-core",
    "tests/windows-core",
]

# ── Shared dependencies ──────────────────────────────────────────────
# All crates reference these via { workspace = true } to prevent version drift.
[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Database
rusqlite = { version = "0.37", features = ["bundled"] }  # matches upstream yantrikdb 0.10.1 (one crate may link sqlite3)

# Async / networking
zbus = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = "0.8"
ureq = { version = "2", features = ["json"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hashing
sha2 = "0.10"

# Time / IDs
chrono = { version = "0.4", features = ["serde"] }
uuid7 = "1"

# Text / parsing
regex = "1"
html2text = "0.12"
mailparse = "0.15"
base64 = "0.22"

# Email
imap = "2.4"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["rustls-tls", "builder", "smtp-transport"] }

# Audio
cpal = "0.15"
rubato = "0.16"

# WebSocket
tungstenite = "0.24"
url = "2"

# Concurrency
crossbeam-channel = "0.5"

# UI
# Both renderers are compiled in; SLINT_BACKEND picks at runtime.
# femtovg draws on the GPU (WSLg reaches the real adapter via GALLIUM_DRIVER=d3d12);
# software is the fallback for hosts with no usable GL.
# unstable-winit-030: the window a title bar moves (`yantrik_app_runtime::chrome`, #256).
slint = { version = "1.17", features = ["renderer-femtovg", "renderer-software", "unstable-winit-030"] }

# System
sysinfo = "0.33"
libc = "0.2"

# Internal crates
yantrik-harness = { path = "crates/yantrik-harness" }
yantrik-agent-terminal = { path = "crates/yantrik-agent-terminal" }
yantrik-companion-core = { path = "crates/yantrik-companion-core" }
yantrik-companion-instincts = { path = "crates/yantrik-companion-instincts" }
yantrik-companion-cortex = { path = "crates/yantrik-companion-cortex" }
yantrik-companion-tools = { path = "crates/yantrik-companion-tools" }
yantrik-design-tokens = { path = "crates/yantrik-design-tokens" }
yantrik-ipc-contracts = { path = "crates/yantrik-ipc-contracts" }
yantrik-image-core = { path = "crates/yantrik-image-core" }
yantrik-email-text = { path = "crates/yantrik-email-text" }
yantrik-shell-core = { path = "crates/yantrik-shell-core" }
yantrik-ui-kit = { path = "crates/yantrik-ui-kit" }
yantrik-ipc-transport = { path = "crates/yantrik-ipc-transport" }
yantrik-service-sdk = { path = "crates/yantrik-service-sdk" }
yantrik-surface = { path = "crates/yantrik-surface" }
yantrik-app-runtime = { path = "crates/yantrik-app-runtime" }
yantrik-file-follow = { path = "crates/yantrik-file-follow" }
yantrik-manifest = { path = "crates/yantrik-manifest" }
yantrik-version = { path = "crates/yantrik-version" }
yantrik-chat = { path = "crates/yantrik-chat" }
yantrik-companion = { path = "crates/yantrik-companion" }
yantrik-os = { path = "crates/yantrik-os" }
yantrik-brain = { path = "crates/yantrik-brain" }
# Upstream yantrikdb, not a vendored fork. The crate is published as `yantrikdb`
# (it was `yantrikdb-core` at 0.1.0), so the `package =` rename keeps every
# existing `use yantrikdb_core::…` call site compiling unchanged — the same
# approach yantrik-mind has been running on in production.
# The memory engine, pinned to an exact revision of its own repository.
#
# This was `path = "../yantrikdb/crates/yantrikdb-core"`: a directory beside this one, on
# whatever branch it happened to be on. So a clone of this repository could not be built by
# anybody; CI had to check the engine out next door and spent a week red because it checked out
# a main that had moved past Cargo.lock; and a local build silently used whichever branch was
# checked out in the neighbouring directory — which is how a public image shipped without a
# vault fix that had been written two weeks earlier and never left that directory's other branch.
# A revision is one answer, recorded here and in Cargo.lock, the same for everyone.
#
# Working on the engine and the OS together: put this in an untracked .cargo/config.toml
#     [patch."https://github.com/yantrikos/yantrikdb"]
#     yantrikdb = { path = "../yantrikdb/crates/yantrikdb-core" }
yantrikdb-core = { git = "https://github.com/yantrikos/yantrikdb", rev = "9aa589921da244ba07358674986f0bf30f87a198", package = "yantrikdb" }
yantrik-ml = { git = "https://github.com/yantrikos/yantrik-ml.git" }
yantrikdb-server = { path = "crates/yantrikdb-server" }

# The workspace previously had no release profile at all, so release builds ran
# with lto = false. Thin LTO is most of the win for a few percent of build time;
# codegen-units is deliberately left at the default 16 rather than 1, because this
# tree is rebuilt and redeployed constantly and serialising codegen would cost more
# developer time than the extra few percent of runtime is worth.
[profile.release]
lto = "thin"
# A shipped binary has no use for its symbol table, and it is not small: the iteration build
# carries 127 MB of debug info on top of 195 MB of everything else. Stripping is the difference
# between what we need to run and what we needed to compile.
strip = true

# yantrik-ui-slint is one enormous generated module: 55k lines of .slint become a single
# Rust crate that rustc chews through at ~14 GB RSS, and it is rebuilt on EVERY .slint edit.
# Its code is glue — property bindings and layout — while the hot paths (rasterising, text,
# layout solving) live in Slint's own runtime crates, which keep opt-level 3. Dropping the
# generated crate to opt-level 1 costs nothing measurable at runtime and takes minutes off
# every build; more codegen units let it spread across cores instead of one saturated one.
[profile.release.package.yantrik-ui-slint]
opt-level = 1
codegen-units = 32

# Iteration profile: `cargo build --profile fast`. Workspace crates unoptimised and
# incremental (they are what changes); every dependency at opt-level 3 (they are what runs).
# The software rasteriser lives in the deps, so a fast build still draws at release speed.
[profile.fast]
inherits = "dev"
opt-level = 0
debug = false
incremental = true
[profile.fast.package."*"]
opt-level = 3

# Only optimize LLM-critical deps in dev builds (candle, tokenizers).
# Everything else compiles at opt-level 0 for faster debug builds.
[profile.dev.package.candle-core]
opt-level = 2
[profile.dev.package.candle-nn]
opt-level = 2
[profile.dev.package.candle-transformers]
opt-level = 2
[profile.dev.package.tokenizers]
opt-level = 2

# Local override: adds "thinking": false to API requests for Qwen3.5/DeepSeek
[patch."https://github.com/yantrikos/yantrik-ml.git"]
yantrik-ml = { path = "crates/yantrik-ml" }
