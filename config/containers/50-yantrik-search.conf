# Yantrik OS: where a short image name resolves, for podman (#401).
#
# The Container Manager's Pull and Run take the name a person types, "nginx" or "redis", the way
# docker does. Debian's podman names no registry to search, so every short name its shortnames
# list does not alias failed with "short-name did not resolve". One registry, Docker Hub, which is
# where docker would have looked: with one there is nothing to choose between and no prompt,
# which the app, having no terminal, could not answer. A name with a registry in it
# (ghcr.io/..., quay.io/...) goes where it says, and a local image is found before any of this.
# Installed into /etc/containers/registries.conf.d by the image and by `yantrik-update reconcile`.
unqualified-search-registries = ["docker.io"]
