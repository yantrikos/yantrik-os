# Yantrik OS: a process may attach to (ptrace) only its own descendants.
#
# Debian leaves Yama's ptrace_scope at 0: any process may attach to any other of the same user.
# On this desktop the same user runs the minds, and the shell holds the vault's key, the password
# typed to unlock the screen and the lock's channel in its memory. With scope 0 anything a mind
# starts could read them, or take the channel, by attaching to the shell. Scope 1 keeps debuggers
# on their own children (gdb ./program, strace ./program) and stops a sibling from attaching.
# Installed by the image and by `yantrik-update reconcile` (#414).
kernel.yama.ptrace_scope = 1
