# Yantrik OS (#1124): where a Mind's workshops live, /var/lib/yantrik/workshops/<uid>/<mind>/<name>.
# Root's, 0755, so a person cannot rename it or anything above it. <uid>/ (0700, the person's) is made
# by yantrik-update and by the first-run wizard, never by the shell.
d /var/lib/yantrik 0755 root root -
d /var/lib/yantrik/workshops 0755 root root -
