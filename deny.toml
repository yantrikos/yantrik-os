# What the workspace may depend on (cargo-deny; docs/architecture.md). CI reports it on every pull
# request and does not fail on it yet: the first run lists what is there today, the list is
# worked down, and then the job becomes blocking.

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.9
# Yantrik OS is GPL-3.0: a dependency must be under a licence that can be combined with it.
allow = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

[licenses.private]
# A crate marked `publish = false` is not checked. The workspace's other crates are listed until
# each declares its licence, which is part of the SDK work (migration step 6).
ignore = true

[bans]
# Two versions of one crate cost build time and memory on a host that has little to spare; they
# are listed, to be worked down, not refused.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The memory engine, pinned by revision in Cargo.toml.
allow-git = ["https://github.com/yantrikos/yantrikdb"]
