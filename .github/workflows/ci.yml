name: CI

# What this exists for.
#
# This repository has a growing set of tests whose whole job is to catch a class of mistake
# from coming back — that every shipped app draws its header with the shared component, that
# the screen a caller asks for is the screen the shell draws, that an application answers to
# one name on every surface, that the release script packages the directory it built into.
# Each was written after the thing it guards had already gone wrong once.
#
# None of them ran anywhere except on a laptop, when someone remembered. A guard nobody runs
# is a comment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A CI machine has no reason to build with debug info it will throw away.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # The engine is a git dependency pinned by revision in Cargo.toml, so there is nothing to
      # check out beside this repository any more. For a week this workflow cloned the engine's
      # main next door, main moved past Cargo.lock, and every run was red for a reason that had
      # nothing to do with the commit being tested.

      # The native libraries the workspace links against, found by looking for the -sys crates
      # in Cargo.lock rather than by guessing: alsa-sys, libudev-sys, openssl-sys,
      # speech-dispatcher-sys, wayland-sys. Slint's winit backend adds xkbcommon and fontconfig.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libssl-dev \
            libspeechd-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libinput-dev \
            libgbm-dev \
            libegl1-mesa-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Slint's macro expansion is the expensive part of this build, so a cache is the
      # difference between a check that runs on every push and one that gets turned off.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-v1

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

  arm64-cross:
    name: arm64 cross-build
    # #270's Pi 5 image and general ARM64 image are built from an aarch64 build of the whole
    # workspace. This job keeps that build green with the same setup script and env file a
    # real machine uses.
    #
    # In a Debian 13 container, not on the Ubuntu runner itself. Ubuntu 24.04's multiarch
    # cannot install libglib2.0-dev:arm64 (pulled in by libspeechd-dev:arm64) beside its own
    # amd64 packages: apt refused with "held broken packages" twice, the second time with the
    # runner's amd64 glib tools already removed. Debian 13, the system the ARM64 image is built
    # on, installs the same list cleanly; container 531 on node2 built the whole workspace this
    # way. The release target directory comes to about 6 GB, which fits the runner's disk.
    #
    # It builds; it does not run the tests. The binaries are arm64 and the runner is x86, and
    # running them would need an arm64 machine or qemu-user. Not a required check, so it does
    # not hold up merges.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: debian:trixie
    env:
      # The warning suppression the machine-local .cargo/config.toml gives x86_64, for the
      # rustc 1.93.x lint-emitter ICEs; that file is gitignored, so the flag travels here, as
      # the target-specific variable. Not RUSTFLAGS: a bare RUSTFLAGS replaces every target's
      # flags instead of adding to them.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -A warnings
    steps:
      - name: Tools the container lacks
        run: apt-get update -qq && apt-get install -y -qq git curl ca-certificates > /dev/null

      - uses: actions/checkout@v4

      - name: Cross-build environment
        # The cross gcc and the arm64 libraries the -sys crates link against. Idempotent;
        # the pure half of what it does to apt sources is held by the selftest in the
        # shell-scripts job below. The container runs as root, so no sudo.
        run: bash deploy/yantrik-os/setup-arm64-cross.sh

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-arm64-debian-v1
          cache-on-failure: true

      - name: The environment the build needs
        # The one copy of the six variables, appended to $GITHUB_ENV from the same file
        # the setup script prints. Comments are dropped: $GITHUB_ENV reads KEY=value.
        run: grep -Ev '^[[:space:]]*(#|$)' deploy/yantrik-os/arm64-cross.env >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-gnu --workspace --bins --locked

  shell-scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # These scripts build and publish the OS and update installed machines. A syntax error in
      # one of them is found at the worst possible moment otherwise — mid-release, or mid-update
      # on a machine that then has half a build on it.
      # A script written on Windows is committed without its executable bit, and nothing
      # notices until something runs it by path. The first ISO pipeline run got through a
      # forty-minute release build and then stopped at `shelved-bins.sh: Permission denied`.
      # Six tracked files were like that. Anything that starts with `#!` is meant to be run.
      - name: Every script is executable
        run: |
          fail=0
          while read -r mode _ _ f; do
            [ "$mode" = "100644" ] || continue
            [ "$(head -c 2 "$f" 2>/dev/null)" = "#!" ] || continue
            echo "::error file=$f::starts with #! but is not executable in git (git update-index --chmod=+x $f)"
            fail=1
          done < <(git ls-files -s)
          exit $fail
      - name: Parse every script
        run: |
          fail=0
          while IFS= read -r f; do
            # Only actual shell. The first version of this ran `bash -n` over scripts/* and
            # choked on a Python file, which is a failure of the check rather than of the code.
            head -n1 "$f" | grep -qE '^#!.*(bash|/bin/sh|env sh)' || continue
            if ! bash -n "$f" 2>/tmp/err; then
              echo "::error file=$f::$(cat /tmp/err)"
              fail=1
            fi
          done < <(git ls-files '*.sh' 'deploy/yantrik-os/yantrik-*' 'scripts/*' 'config/labwc/autostart')
          exit $fail

      # Every tracked script must be executable. A fresh clone could not run this repository's
      # own build, deploy, probe or survey scripts because 42 of 45 were recorded as mode 644.
      - name: Scripts are executable
        run: |
          bad=$(git ls-files -s | awk '$1=="100644"{print $4}' | while read -r f; do
            [ -f "$f" ] && head -c2 "$f" | grep -q '#!' && echo "$f"
          done || true)
          if [ -n "$bad" ]; then
            echo "::error::these start with #! but are not executable in git:"
            echo "$bad"
            echo "fix with: git update-index --chmod=+x <file>"
            exit 1
          fi

      - name: cloud-init parses
        run: python3 -c "import yaml,sys; yaml.safe_load(open('deploy/yantrik-os/cloud-init/user-data.yaml')); print('user-data.yaml OK')"

      # Two selftests that have existed for a while and have never run anywhere but on somebody's
      # machine, which is the same as not existing. Both are stdlib-only Python over a fake of
      # whatever they talk to, so they need nothing installed and take a few seconds.
      #
      # yos-mcp's matters most: it holds the bridge's copy of the mind-mode decision table
      # against `deploy/yantrik-os/mind-mode-vectors.json`, which the shell's own tests generate
      # from `mind_mode::Modes::decide`. The table is written twice on purpose (see
      # design/mind-modes-2026-09-21.md) and this is the thing that stops the two copies drifting
      # apart silently. The Rust half — that the checked-in vectors are still what the shell
      # decides — runs in the `cargo test` job above.
      - name: The MCP bridge agrees with the shell about what the mind may do
        run: python3 deploy/yantrik-os/yos-mcp-selftest.py

      - name: The update server's publish path
        run: python3 deploy/yantrik-os/server/publish_selftest.py

      # `yos` is what every one of those MCP tools actually runs, and it had a whole command
      # that could not work: perception is registered "on demand" and nothing anywhere supplied
      # the demand, so os_perception answered "no socket for 'perception'" on every boot of the
      # machine. This holds the request that starts it against the action the shell publishes.
      - name: yos starts an on-demand service when something asks for it
        run: python3 deploy/yantrik-os/yos-selftest.py

      # The updater's own offline checks, against a scratch $YANTRIK_PREFIX. Same story as the
      # two above: it has existed for a while and only ever run on somebody's machine. It holds
      # where the update channel comes from, and that `.version` is written from the same string
      # as the BUILD marker — the pair that gave a machine two answers about its own version.
      - name: The updater agrees with itself about channel and version
        run: bash deploy/yantrik-os/yantrik-update selftest

      # The session's shell supervisor (#247): a crash brings the shell back, a crash loop stops,
      # a logout ends it. Fake shells and a fake display socket; no compositor needed.
      - name: A shell that dies is started again
        run: sh deploy/yantrik-os/yantrik-shell selftest

      # The services list the packaging scripts ship (#244), derived from the services' own
      # yantrik.toml manifests the way the shell finds them. deploy.sh's BUILD_ALL branch built
      # two services fewer than the default beside it, and publish-components.sh published
      # channels whose shell registered a11y and perception with no binaries behind them —
      # hand-written lists again, the #99 defect for services. The selftest holds the shell's
      # registrations and both packaging scripts against the reader; no builds, no machine.
      - name: The packaging scripts ask the tree which services they ship
        run: bash deploy/yantrik-os/service-bins.sh selftest

      # The arm64 cross-build setup's offline half (#270): the apt-sources rewriters — a
      # wrong one bricks a machine's apt-get update, and on a runner that shows up as a
      # red arm64 job an hour into it — and the env file's shape, which both a build
      # machine's shell and $GITHUB_ENV have to accept as-is.
      - name: The arm64 cross-build setup holds its sources rewriting and its env file
        run: bash deploy/yantrik-os/setup-arm64-cross.sh selftest

      # The harnesses that ship as source (harnesses/lib, harnesses/pi, harnesses/deepseek).
      # Same shape as the two above: stdlib-only Python over a fake of everything it talks to —
      # a fake desktop socket, a fake yos-mcp, a fake chat-completions API and a fake `pi` — so
      # it needs no network, no key, no node and nothing installed. What it is actually holding
      # is the rule the desktop enforces and a harness cannot test for itself: every turn handed
      # over is closed exactly once, however the mind behind it behaves.
      - name: The attachable harnesses close every turn exactly once
        run: python3 -m unittest discover -s harnesses/tests -v

      # The Blender control surface's tests: the addon that answers for somebody else's
      # program, driven against a fake `bpy`. Stdlib-only, no Blender and no display needed,
      # like everything above. Among them is one vector the Rust side asserts too — the
      # revision hash in yantrik-ipc-contracts — so the Python port of the wire cannot drift
      # from the original without a test failing in one language or the other. What these
      # cannot say is that a real Blender agrees; that half is the headless run recorded in
      # design/blender-surface-2026-09-22.md.
      - name: The Blender addon speaks the runtime's own wire and vocabulary
        run: python3 -m unittest discover -s tests/blender-core

      # The Python surface SDK (sdk/python/yantrik_surface), which the Blender addon above is
      # built on and any outside author imports. Stdlib-only like the rest. It holds itself to
      # the Rust runtime it ports: every refusal it asserts is read out of the Rust source it
      # comes from, its revision vectors were produced by serde_json, the example is driven by
      # the real `yos` over real sockets (a grant spent end to end through a stand-in shell),
      # and it replays the policy vectors generated from gate::decide once they are in the tree.
      - name: The Python surface SDK answers like the Rust dispatch
        run: python3 -m unittest discover -s sdk/python/tests -v

      # What an outside author copies and reads (the surface SDK's piece F): the Python template,
      # held to the protocol by the real `yos check`; the LibreOffice adapter, built only on the
      # public SDK, driven against a fake UNO and over a real socket (its run against a real
      # LibreOffice skips here: no soffice); and the guide in docs/sdk, whose every code block must
      # still be in the file it quotes. The Rust template and examples run in the cargo test job.
      - name: The SDK's template, LibreOffice adapter and guide hold
        run: |
          python3 -m unittest discover -s templates/python-surface/tests -v
          python3 -m unittest discover -s adapters/libreoffice/tests -v
          python3 -m unittest discover -s docs/sdk/samples -v

      # The record #161 asks for: a service's own JSON-RPC methods answer on the same socket
      # beside its gated app.act and meet no gate until #43 can tell callers apart, so every one
      # of them is listed in docs/app-control.md beside the graded action that does the same
      # thing. This walks each services/*/src/main.rs dispatch — literal arms, and const arms
      # resolved through yantrik-ipc-contracts — and holds the two lists together: a method with
      # no row fails, a row with no method fails, and a `change` that names neither a grade nor
      # `none` fails. Stdlib-only source text, like everything above; it runs no service.
      - name: Every method a service answers stands in the guide beside its grade
        run: python3 -m unittest discover -s tests/service-methods -v
