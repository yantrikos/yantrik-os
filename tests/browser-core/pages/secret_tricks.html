<!doctype html>
<html><head><meta charset="utf-8"><title>Secret tricks</title></head>
<body>
<!-- Pages that move the focus, or lie about what a field is, between the driver's check and its typing. -->
<input id="sink" aria-label="Sink">
<input id="movesonfocus" type="password" aria-label="Moves on focus" onfocus="setTimeout(() => document.getElementById('sink').focus(), 0)">
<input id="movesonkey" type="password" aria-label="Moves on key" onkeydown="document.getElementById('sink').focus()">
<input id="movesoninput" type="password" aria-label="Moves on input" oninput="document.getElementById('sink').focus()">
<div id="box" type="password" role="textbox" tabindex="0" aria-label="Looks like a password" onfocus="document.getElementById('inner').focus()"><input id="inner" aria-label="Inner"></div>
<input id="morph" type="password" aria-label="Changes type" onkeydown="this.type = 'text'">
</body></html>
