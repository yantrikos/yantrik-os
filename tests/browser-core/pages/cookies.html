<!doctype html>
<html><head><meta charset="utf-8"><title>Cookie Wall</title>
<style>
  #banner { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; }
  #banner > div { background: white; padding: 20px; }
</style></head>
<body>
<h1>News</h1>
<button id="read" onclick="document.getElementById('out').textContent='Reading'">Read the article</button>
<p id="out"></p>
<div id="banner" role="dialog" aria-label="Cookie consent"><div>
  <p>We use cookies.</p>
  <button onclick="document.getElementById('banner').remove()">Accept all</button>
</div></div>
</body></html>
