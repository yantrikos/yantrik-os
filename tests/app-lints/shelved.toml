# The apps that are in this tree and not in this build.
#
# A shelved app is not shipped: it is gone from the launcher, from the Lens, from the
# command palette, from the release bundle and from every name a mind could open it
# by. Its source stays here, it stays a workspace member, and it keeps compiling --
# so it keeps its debt, and the debt keeps being counted.
#
# What this file changes is where that debt is reported. A shelved app's findings are
# printed under their own heading with the reason the app is on the shelf, they are
# left out of the shipping totals, and they do not fail the run. Nobody is being asked
# to fix them: the decision was that these apps get built properly or stay off the
# shelf, and a lint failing every day about an app nobody is working on is a lint that
# gets switched off.
#
# This is not the allowlist and it is not the baseline. The allowlist says an item is
# correct; the baseline says an item is wrong but old; this says the whole app is not
# in the build. An app named here that does not exist under apps/ is an error -- a
# shelf entry for something that was deleted hides nothing and confuses everyone.
#
# The shelf itself -- what the launcher refuses, and why -- is SHELVED in
# crates/yantrik-ui/src/wire/dock.rs. design/shelved-2026-09-20.md is the account.
# Un-shelving an app is deleting its entry here and there.

[music-player]
reason = """
Nothing plays audio. There is no playback engine, no scanner and no library behind the \
screen: double-clicking a song logs "(stub)", and only YANTRIK_MUSIC_DEMO=1 can put a \
track on it. 2168 lines of Slint over 312 of Rust.\
"""
