# Deliberate exemptions from the two app lints.
#
# This is not the place to put debt. Debt goes in baseline.json, where it is
# counted on every run and can only shrink. An entry here says the item is
# correct as it stands and should never be reported again, and it must say why
# in prose. An entry without a reason is an error and fails the run: a dead
# control has to be argued for in writing or it is not allowed.
#
# Shape:
#
#   [<lint>]
#   <app> = [
#     { name = "<slint property or callback name>", reason = "<why>" },
#   ]
#
# Names are as the lint prints them: Slint spelling for properties
# (`doc-file-path`), the generated Rust spelling without the `on_` for
# callbacks (`snip_save`).

[unset-property]
calendar = [
  { name = "agent-context", reason = "Written by the framework's rail: `yantrik_app::rail_window!(CalendarApp)` in apps/calendar/src/lib.rs implements RailView, whose render_rail sets the rail's rows from the model on every rail change. The macro's expansion is not text under apps/calendar/src, so the lint cannot see the setter; tests/window.rs reads the rows back off the window." },
  { name = "agent-suggestions", reason = "As agent-context: render_rail, from `yantrik_app::rail_window!`, sets the suggestions; tests/window.rs reads them back." },
  { name = "agent-unavailable", reason = "As agent-context: render_rail, from `yantrik_app::rail_window!`, sets the sentence shown when the Mind cannot answer." },
]
document-editor = [
  { name = "agent-context", reason = "Written by the framework's rail: `yantrik_app::rail_window!(DocumentEditorApp)` in apps/document-editor/src/lib.rs implements RailView, and view/render.rs calls its render_rail on every render. The macro's expansion is not text under apps/document-editor/src, so the lint cannot see the setter; tests/rail.rs reads the rows back off the window." },
  { name = "agent-suggestions", reason = "As agent-context: render_rail, from `yantrik_app::rail_window!`, sets the suggestions; tests/rail.rs reads them back." },
  { name = "agent-unavailable", reason = "As agent-context: render_rail, from `yantrik_app::rail_window!`, sets the sentence shown when the Mind cannot answer." },
]
snippet-manager = [
  { name = "agent-context", reason = "Written by the framework's rail: `yantrik_app::rail_window!(SnippetManagerApp)` in apps/snippet-manager/src/lib.rs implements RailView, and view.rs calls its render_rail whenever the rail part changes. The macro's expansion is not text under apps/snippet-manager/src, so the lint cannot see the setter; tests/rail.rs reads the rows back." },
  { name = "agent-suggestions", reason = "As agent-context: render_rail, from `yantrik_app::rail_window!`, sets the suggestions; tests/rail.rs reads them back." },
  { name = "agent-unavailable", reason = "As agent-context: render_rail, from `yantrik_app::rail_window!`, sets the sentence shown when the Mind cannot answer." },
  { name = "proposal", reason = "As agent-context: render_rail, from `yantrik_app::rail_window!`, draws the card the Mind's answer lands on; tests/rail.rs reads its body back off the window." },
  { name = "proposal-working", reason = "As agent-context: render_rail, from `yantrik_app::rail_window!`, sets it while the Mind is asked; the header's AI and the pane's AI Explain draw from it." },
]

[dead-handler]
image-viewer = [
  { name = "toggle_fit", reason = "The shared viewer component applies fit to its own property when the button is pressed; the callback is only the notification that it did. Handling it again here is the bug that made the fit button do nothing at all -- see design/images-2026-09-20.md, 'Rotation is applied once'. The control-surface actions set the property directly, because no button was pressed in that case." },
  { name = "viewer_rotate_left", reason = "As toggle_fit: the component has already rotated its own property. The app's handler applied it a second time, which turned a 90 degree press into 180. The handler is now a notification and must stay empty." },
  { name = "viewer_rotate_right", reason = "As viewer_rotate_left -- the component rotates itself and this is the notification. Doing the work twice was the double-rotation bug." },
  { name = "viewer_flip_horizontal", reason = "As viewer_rotate_left: the component flips its own property and the callback only reports it." },
  { name = "viewer_flip_vertical", reason = "As viewer_rotate_left: the component flips its own property and the callback only reports it." },
]
