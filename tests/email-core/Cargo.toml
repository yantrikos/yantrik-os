[package]
name = "yantrik-email-core-tests"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yantrik-ipc-contracts = { path = "../../crates/yantrik-ipc-contracts" }
# What `services/email-service/src/google.rs` needs. Same versions as the workspace, so the file
# included below is compiled against exactly what the service compiles it against.
sha2 = "0.10"
base64 = "0.22"
# What `envelope.rs` needs, for the same reason.
mailparse = "0.15"
chrono = "0.4"
[lib]
path = "lib.rs"
