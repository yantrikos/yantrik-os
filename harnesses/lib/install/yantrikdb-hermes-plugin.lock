# The YantrikDB memory provider's own dependencies, at exact versions with their hashes, for
# hermes.sh: uv pip install --require-hashes --no-deps -r <this>. The provider itself comes
# from a git commit (--no-deps), and requests from Hermes's own locked environment, so nothing
# here is resolved from PyPI at install time. click is held to the version Hermes's uv.lock
# has, so this never moves one of Hermes's packages. Regenerated by hand when the pin moves:
#   printf 'yantrikdb==0.23.1\nclick==8.3.1\n' > in.txt
#   uv pip compile in.txt --generate-hashes --universal --python-version 3.11 --no-header --no-annotate
