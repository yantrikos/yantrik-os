# What the desktop can say about Hermes before Hermes is running.
# See harnesses/pi/harness.yaml for why this file exists at all.
id: hermes
name: Hermes
detail: Hermes, with this desktop as one of its platforms
docs: README.md

# No `unit`. Hermes is started by Hermes — its own gateway service — and this directory is a
# plugin inside that gateway rather than a process of ours. So the row never offers to start
# it: there is nothing here to start, and `systemctl --user enable yantrik-hermes` would fail
# with a sentence about a unit that was never meant to exist.

requires:
  - binary: hermes
    why: Hermes itself, which brings its own model, keys and memory
  - file: ~/.hermes/plugins/yantrik/plugin.yaml
    why: the desktop plugin, copied into your Hermes install and enabled there

install:
  # Hermes itself when it is not here — by Hermes's own installer, into ~/.hermes, no root —
  # then the plugin and Hermes's gateway. The image ships no Hermes, so a command that only
  # copied the plugin failed on every fresh machine with "hermes: not found". `{dir}` is
  # wherever this manifest was read from, so it works from the image and from a checkout.
  command: sh {dir}/../lib/install/hermes.sh {dir}
  doing: installing Hermes from github.com/NousResearch/hermes-agent, then its desktop plugin

configure:
  # Hermes's own model picker, in a terminal: every provider Hermes knows (NVIDIA NIM,
  # OpenRouter, Anthropic, a local endpoint...) and its sign-in flows, none of which the desktop
  # has to copy. Opened by itself when Install finishes, and from the row after that. The
  # gateway is restarted afterwards so the running Hermes answers with what was chosen.
  command: hermes model && systemctl --user restart hermes-gateway
  label: Choose model
  title: Choose Hermes's model

# Hermes keeps its model, endpoint, keys and memory in ~/.hermes, as it always has, so there is
# no file of ours for the person to write and nothing to check for.
