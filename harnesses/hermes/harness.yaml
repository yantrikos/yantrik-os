# What the desktop can say about Hermes before Hermes is running.
# See harnesses/pi/harness.yaml for why this file exists at all.
id: hermes
name: Hermes
detail: Hermes, with this desktop as one of its platforms
docs: README.md

# No `unit`. Hermes is started by Hermes — its own gateway service — and this directory is a
# plugin inside that gateway rather than a process of ours. So the row never offers to start
# it: there is nothing here to start, and `systemctl --user enable yantrik-hermes` would fail
# with a sentence about a unit that was never meant to exist.

# Hermes's memory is this machine's YantrikDB, the one Yantrik Mind keeps, so the two remember the
# same person and Hermes keeps no second memory of them. The installer gives Hermes the YantrikDB
# memory provider in its `yantrik` mode; the person's Install click, once the install has worked,
# grants Hermes ordinary recall, remember and believe (crates/yantrik-ui/src/harness_memory.rs); and
# every turn then carries the credential the provider presents to the memory server (adapter.py).
# Installed any other way, Hermes is granted nothing until the person grants it.
memory: yantrikdb

requires:
  - binary: hermes
    why: Hermes itself, which brings its own model and keys
  - file: ~/.hermes/plugins/yantrik/plugin.yaml
    why: the desktop plugin, copied into your Hermes install and enabled there

install:
  # Hermes itself when it is not here — by Hermes's own installer, into ~/.hermes, no root —
  # then the plugin, the YantrikDB memory provider and Hermes's gateway. The image ships no
  # Hermes, so a command that only copied the plugin failed on every fresh machine with
  # "hermes: not found". `{dir}` is wherever this manifest was read from, so it works from the
  # image and from a checkout.
  command: sh {dir}/../lib/install/hermes.sh {dir}
  doing: installing Hermes from github.com/NousResearch/hermes-agent, its desktop plugin and its YantrikDB memory

configure:
  # Hermes's own model picker, in a terminal: every provider Hermes knows (NVIDIA NIM,
  # OpenRouter, Anthropic, a local endpoint...) and its sign-in flows, none of which the desktop
  # has to copy. Opened by itself when Install finishes, and from the row after that. The
  # gateway is restarted afterwards so the running Hermes answers with what was chosen. The
  # window is held open when the command ends, so the last line says it can be closed: a window
  # that went quiet after the picker looked like one still waiting for something.
  command: hermes model && systemctl --user restart hermes-gateway && echo "Done. You can close this window."
  label: Choose model
  title: Choose Hermes's model

# Hermes keeps its model, endpoint and keys in ~/.hermes, as it always has, so there is no file
# of ours for the person to write and nothing to check for.
