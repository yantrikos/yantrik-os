# What the desktop can say about OpenClaw before OpenClaw is running.
# See harnesses/pi/harness.yaml for why this file exists at all.
id: openclaw
name: OpenClaw
detail: The local-first personal agent, with its own memory
docs: README.md
unit: yantrik-openclaw.service

requires:
  - binary: openclaw
    why: OpenClaw itself — install it from its own documentation, which this README points at
  - binary: python3
    why: the harness is stdlib Python, and the image already carries it
  - file: yantrik_openclaw.py
    why: the harness script, staged beside this file

install:
  # OpenClaw's own documented route, `npm install -g openclaw`, into ~/.local, with the
  # Node it requires (24.16 or newer) fetched first. Its install scripts are allowed to run,
  # unlike Pi's: OpenClaw's postinstall sets up the plugins it bundles, and it does not work
  # without them — which is why the version is pinned and bumped by hand: an unpinned package
  # with install scripts is whatever was published last, run as the person. Onboarding
  # asks questions, so it is `configure` below: a terminal the person answers it in.
  # npm 11 runs no install scripts unless each package is allowed by name, so the four this
  # version needs are named: OpenClaw's own, and the native modules under it. Anything else a
  # later version adds stays off until someone reads it and adds it here.
  command: >-
    sh {dir}/../lib/install/npm.sh openclaw@2026.9.6 openclaw 24.16
    --allow-scripts=openclaw,koffi,protobufjs,@google/genai
  doing: fetching Node from nodejs.org and openclaw 2026.9.6 from npm

configure:
  # OpenClaw's own onboarding: its model, keys and memory, which stay in ~/.openclaw.
  command: openclaw onboard
  label: Set up OpenClaw
  title: Set up OpenClaw

# No `setup` either: with no config file at all this harness runs `openclaw agent` with
# OpenClaw's own defaults, which is a working setup for somebody who has configured OpenClaw.
# ~/.config/yantrik/openclaw.json only exists to override that, and the README says so.
