[package]
name = "yantrik-companion"
version = "0.1.0"
edition = "2021"
description = "Yantrik companion agent — instincts, urges, context, learning, all in-process"

[dependencies]
yantrik-companion-core = { workspace = true }
yantrik-companion-instincts = { workspace = true }
yantrik-companion-cortex = { workspace = true }
yantrik-companion-tools = { workspace = true }
yantrik-chat = { workspace = true }
yantrikdb-core = { workspace = true }
yantrik-brain = { workspace = true }
yantrik-ml = { workspace = true, features = ["api-llm", "claude-cli"] }
yantrik-os = { workspace = true }
# The calendar tools are callers of `calendar-service`, not a second calendar. These two carry
# its typed parameters and the socket, and neither pulls in Slint — the companion runs inside the
# shell and must not link a widget toolkit to keep an appointment.
yantrik-ipc-contracts = { workspace = true }
yantrik-ipc-transport = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
uuid7 = { workspace = true }
tracing = { workspace = true }
tungstenite = { workspace = true }
url = { workspace = true }
imap = { workspace = true }
native-tls = { workspace = true }
lettre = { workspace = true }
# The reading pane's HTML-to-text rule, shared with the email service so the two cannot drift.
yantrik-email-text = { workspace = true }
mailparse = { workspace = true }
ureq = { workspace = true }
regex = { workspace = true }
crossbeam-channel = { workspace = true }

[dev-dependencies]
# Only to spell the `LLMBackend` trait's return type on a stub mind in the bond scoring tests.
anyhow = "1"
