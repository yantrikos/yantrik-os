[package]
name = "yantrik-ui"
version = "0.3.0"
edition = "2021"
description = "Yantrik OS desktop shell — Slint native UI"

[[bin]]
name = "yantrik-ui"
path = "src/main.rs"

[[bin]]
name = "test-brain"
path = "src/bin/test_brain.rs"

[dependencies]
yantrik-harness = { workspace = true }
# Agents' commands, each in a PTY the shell owns (design/agents-workspace-2026-09-23.md, decision 3).
yantrik-agent-terminal = { workspace = true }
yantrik-companion = { workspace = true }
yantrik-chat = { workspace = true }
yantrik-ml = { workspace = true, features = ["api-llm", "claude-cli"] }
yantrikdb-core = { workspace = true }
yantrik-os = { workspace = true }
yantrik-ui-slint = { path = "../yantrik-ui-slint" }
yantrik-ipc-contracts = { workspace = true }
yantrik-ipc-transport = { workspace = true }
# The shell publishes its own app.describe / app.act, like every app under apps/.
yantrik-app-runtime = { workspace = true }
yantrik-shell-core = { workspace = true }
# What is running here, resolved in one place: About, the boot screen, Settings and the
# /etc/os-release the installer writes all say the same string.
yantrik-version = { workspace = true }
slint = { workspace = true }
crossbeam-channel = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
# The agent catalog's roles are TOML files (src/agents/catalog.rs, config/agents/).
toml = "0.8"
# Notification timestamps arrive from the service as RFC 3339; the centre draws "4 minutes ago".
chrono = { workspace = true }
cpal = { workspace = true }
rubato = { workspace = true }
anyhow = "1"
pty-process = "0.5"
vt100 = "0.16"
native-tls = { workspace = true }
imap = { workspace = true }
lettre = { workspace = true, features = ["hostname"] }
base64 = { workspace = true }
ureq = { workspace = true }
# One-shot hardware read for the first-boot scan. The system observer only
# publishes on its poll cycle (10s by default), which is far too slow for a
# scan the user is watching.
sysinfo = { workspace = true }
mailparse = { workspace = true }
html2text = { workspace = true }
rusqlite = { workspace = true }
libc = { workspace = true }
# Un-minimising a window without maximising it (#265, src/foreign_toplevel.rs): wlrctl 0.2.2
# exposes no unset_minimized, so the shell speaks the wlr foreign-toplevel protocol itself.
# Both are already in the tree through winit, at the versions Cargo.lock resolves (0.31, 0.3).
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[features]
default = ["claude-cli"]
claude-cli = ["yantrik-ml/claude-cli"]
llamacpp = ["yantrik-ml/llamacpp"]
llamacpp-cuda = ["llamacpp", "yantrik-ml/llamacpp-cuda"]
llamacpp-rocm = ["llamacpp", "yantrik-ml/llamacpp-rocm"]
llamacpp-vulkan = ["llamacpp", "yantrik-ml/llamacpp-vulkan"]
llamacpp-metal = ["llamacpp", "yantrik-ml/llamacpp-metal"]
cuda = ["yantrik-ml/cuda"]
metal = ["yantrik-ml/metal"]
accelerate = ["yantrik-ml/accelerate"]

