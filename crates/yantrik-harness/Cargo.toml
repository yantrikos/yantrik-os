[package]
name = "yantrik-harness"
version = "0.1.0"
edition = "2021"
description = "How an agent harness attaches to Yantrik OS — the OS holds which mind is answering, and nothing else"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Conversation ids and agent tokens come from the OS's own random source. Already in the tree
# (0.2.x, through half the workspace), so this adds an edge to the lock and nothing to download.
getrandom = "0.2"
# Runs outlive the chat (#25): state and a sequenced event log, in the SQLite the workspace
# already links (bundled, one copy through yantrikdb).
rusqlite = { workspace = true }

[dev-dependencies]
# Only the examples need a socket; the host itself is deliberately transport-free so it can be
# tested without a running shell.
yantrik-ipc-transport = { workspace = true }
yantrik-ipc-contracts = { workspace = true }
tokio = { workspace = true }

[[example]]
name = "echo-harness"
path = "examples/echo_harness.rs"

[[example]]
name = "host-probe"
path = "examples/host_probe.rs"
