# The one definition of the desktop's two browsers: which profile each runs from, and the one
# DevTools port that is left, as a number to refuse (#1200). Read by Python (yantrik_browser.ports, yos) at run time and by Rust
# (the yantrik-browser-ports crate's build.rs) at build time. Nothing else spells these numbers
# or paths; tests/browser-core/test_ports.py reads the sources to hold that.
#
# The person's Browser: their signed-in profile, which is the browser's own default one. It is
# started with NO --user-data-dir: Chrome 136 and later refuse DevTools on the default data
# directory when it is named (measured on Chrome 152: "DevTools remote debugging requires a
# non-default data directory"), so naming the person's own profile would take their port away.
# A browser is the person's by not being a mind's (listener.py). Only the person's own `yos web`
# and `yos act browser` reach it.
person_port = 9222
#
# Mind View's browser: the one every mind's web tools drive, with no sign-ins of the person's.
# Its profile is under $XDG_DATA_HOME (else ~/.local/share). It has no port either (#1200): like the
# person's Browser it runs with --remote-debugging-pipe, held by the browser service. Any process
# of the session could speak raw DevTools to a port and so go round the service's fence.
mind_view_profile = yantrik/mind-view-browser/chromium
#
# The built-in companion's other browsing identities (launch_browser identity=...): one profile
# each under ~/.local/share/<dir>. They run with no DevTools switch at all (#1200): a window to look
# at, never a port a job could speak to.
identity_profiles = yantrik/browsers
