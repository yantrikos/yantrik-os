[package]
name = "yantrik-service-sdk"
version = "0.1.0"
edition = "2021"
description = "Convenience SDK for building Yantrik OS services"

[dependencies]
yantrik-ipc-contracts = { workspace = true }
yantrik-ipc-transport = { workspace = true }
# The control surface's dispatch, so a service answers `app.act` exactly as an app window does.
yantrik-surface = { workspace = true }
# The vault trait a service keeps its secrets through, and the shell's door to it (`credentials`).
yantrik-foundation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
