[package]
name = "yantrik-companion-tools"
version = "0.1.0"
edition = "2021"
description = "Pure tool implementations for the Yantrik companion agent"

[dependencies]
yantrik-companion-core = { workspace = true }
yantrikdb-core = { workspace = true }
# Private scratch and quarantine directories (`yantrik_ml::private_dir`). Already in the graph
# through yantrik-companion-core; named because the tools call it directly.
# api-llm: the free tiers' key shapes (provider::pool::signup), for the clipboard tools
# that must never hand one to a model. The shell builds yantrik-ml with it anyway.
yantrik-ml = { workspace = true, features = ["api-llm"] }
# The app control surface (app.describe / app.act) lives on the same socket bus the services use.
yantrik-ipc-transport = { workspace = true }
# The typed wire to the services that own a domain — network-service, here. No cycle: this crate
# is a leaf that only `yantrik-companion` depends on, and `yantrik-ipc-contracts` depends on
# nothing but serde and chrono. `yantrik-ipc-transport` above already pulls it in transitively;
# it is named here because `networking.rs` builds its request and response types by name, and a
# dependency used directly should be declared directly.
yantrik-ipc-contracts = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
html2text = { workspace = true }
serde_yaml = { workspace = true }
tungstenite = { workspace = true }
ureq = { workspace = true }
