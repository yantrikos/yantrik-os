[package]
name = "yantrik-app-runtime"
version = "0.1.0"
edition = "2021"
description = "Yantrik OS app runtime — shared infrastructure for standalone app binaries"

[dependencies]
slint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The control surface serves JSON-RPC on its own thread; the transport server is async.
tokio = { workspace = true, features = ["rt", "net", "io-util"] }
yantrik-ipc-contracts = { workspace = true }
yantrik-ipc-transport = { workspace = true }
# The control surface's dispatch — registry, argument checks, revision guard, gate — with no UI.
# `control` adds the hop to the UI thread on top of it.
yantrik-surface = { workspace = true }
# One version string for every app binary's --version, resolved from what is installed.
yantrik-version = { workspace = true }

[features]
# The stand-in for the UI thread that this crate's own socket tests answer on, offered to another
# crate's tests (`control::serve_on_a_standin`) — yantrik-ui reaches the shell's `LOCKED:` rule
# through the real dispatch with it. A dev-dependency feature only: no shipped binary enables it.
test-standin = []
