[package]
name = "email-service"
version = "0.1.0"
edition = "2021"
description = "Yantrik email service — IMAP fetch, SMTP send, folder management"

[[bin]]
name = "email-service"
path = "src/main.rs"

[dependencies]
yantrik-ipc-contracts = { workspace = true }
yantrik-service-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
native-tls = { workspace = true }
imap = { workspace = true }
lettre = { workspace = true, features = ["hostname"] }
mailparse = { workspace = true }
# The reading pane's HTML-to-text rule, shared with the companion so the two cannot drift.
yantrik-email-text = { workspace = true }
base64 = { workspace = true }
# Google sign-in. `ureq` for the token endpoint — the same client the app and the companion
# already use — and `sha2` for the PKCE S256 challenge. The challenge has to be a real SHA-256:
# the helper next door in the companion shells out to `sha256sum` and falls back to base64 of the
# verifier itself, which is PKCE with the protection taken out.
ureq = { workspace = true }
sha2 = { workspace = true }
