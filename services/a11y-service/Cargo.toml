[package]
name = "a11y-service"
version = "0.1.0"
edition = "2021"
description = "Yantrik accessibility service — reads foreign windows semantically over AT-SPI"

[[bin]]
name = "a11y-service"
path = "src/main.rs"

[dependencies]
yantrik-service-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Already in the workspace for the system bus; AT-SPI is D-Bus and nothing more.
zbus = { workspace = true }
# `time`: the watcher gives each question to an application a limit.
tokio = { workspace = true, features = ["rt", "time"] }
# `buffer_unordered`: a listing asks applications together, so one that never answers costs the
# listing one limit, not one limit each. Already in the lock file, through zbus.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# `start_paused`: a listing of applications that never answer is tested in virtual time.
tokio = { workspace = true, features = ["test-util"] }
