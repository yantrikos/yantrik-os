[package]
name = "perception-service"
version = "0.1.0"
edition = "2021"
description = "Yantrik perception service — the kernel's account of what is happening, and who did it"

[[bin]]
name = "perception-service"
path = "src/main.rs"

[dependencies]
yantrik-ipc-contracts = { workspace = true }
yantrik-service-sdk = { workspace = true }
# For socket_dir(): the one directory Landlock still lets this process write in.
yantrik-ipc-transport = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
