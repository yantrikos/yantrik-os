[package]
name = "notifications-service"
version = "0.1.0"
edition = "2021"
description = "Yantrik notification service — the one notification store on the machine, and the session's org.freedesktop.Notifications daemon"

[[bin]]
name = "notifications-service"
path = "src/main.rs"

[dependencies]
yantrik-ipc-contracts = { workspace = true }
yantrik-service-sdk = { workspace = true }
# For `PeerCred` and the /proc walk behind it: every notification records which program opened
# the socket, beside the name that program gave itself (#114).
yantrik-ipc-transport = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# This process *is* the session notification daemon, so that mako and the shell are not both
# racing it for the bus name. `zbus::blocking` on a thread of its own, as the shell's old
# implementation did — the service's own runtime is tokio, and blocking inside a tokio worker
# panics.
zbus = { workspace = true }
tracing = { workspace = true }
# Folding fullwidth, mathematical and accented letters to plain Latin before a name is compared
# with the desktop's own (names.rs).
unicode-normalization = { workspace = true }

[dev-dependencies]
# One test serves the real handler on a real socket, as `run_service` does.
tokio = { workspace = true }
