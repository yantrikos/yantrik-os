[package]
id = "com.yantrikos.notifications"
name = "Notifications Service"
version = "0.1.0"
description = "The one notification store on this machine — and the session's org.freedesktop.Notifications daemon"
publisher = "Yantrik OS"
roles = ["service"]
icon = "bell"

[[permissions]]
capability = "filesystem.user_data"
reason = "Reads calendar event files to run the reminder timer, and keeps its own store file"

[service]
binary = "notifications-service"
methods = [
    "notifications.list",
    "notifications.add",
    "notifications.since",
    "notifications.dismiss",
    "notifications.dismiss_all",
    "notifications.mark_read",
    "notifications.action",
]
autostart = true
