[package]
name = "calendar-service"
version = "0.1.0"
edition = "2021"
description = "Yantrik calendar service — event CRUD, scheduling, file-based storage"

[[bin]]
name = "calendar-service"
path = "src/main.rs"

[dependencies]
yantrik-ipc-contracts = { workspace = true }
yantrik-service-sdk = { workspace = true }
# Not for a socket call — the reminders that needed one moved to notifications-service. For
# `peer_identity`: the surface's `add_event` records the creator from the kernel's peer
# credentials (#201), and resolving a pid to the program's name lives here.
yantrik-ipc-transport = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid7 = { workspace = true }
tracing = { workspace = true }
