[package]
name = "perception-journal"
version = "0.1.0"
edition = "2021"
description = "Drains perception-service into a durable journal, so an outage upstream of memory is recoverable rather than silent"

[[bin]]
name = "perception-journal"
path = "src/main.rs"

[dependencies]
yantrik-ipc-contracts = { workspace = true }
yantrik-service-sdk = { workspace = true }
yantrik-ipc-transport = { workspace = true }
yantrik-journal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
